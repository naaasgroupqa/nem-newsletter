databases:
  - name: self-learning-ai-db
    plan: free
    databaseName: self_learning_ai_db
    user: self_learning_ai_db_user

services:
  - type: web
    name: self-learning-ai
    runtime: python
    rootDir: ai_app
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: self-learning-ai-db
          property: connectionString
      - key: OPENAI_MODEL
        value: gpt-6.1-sol
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: SESSION_SECRET
        generateValue: true
      - key: AUTO_LEARN_DEFAULT
        value: "false"
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_PASSWORD
        sync: false
