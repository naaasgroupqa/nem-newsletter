<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Self-Learning AI</title><link rel="stylesheet" href="/static/app.css"></head>
<body><header><div><b>Self-Learning AI</b><span>Internet + Memory + Files</span></div><form method="post" action="/logout"><button class="ghost">Logout</button></form></header>
<main><section class="chat"><div id="messages"><div class="bubble ai">Ready. I can search the web, use long-term memory, and learn from uploaded files.</div></div><div class="composer"><textarea id="msg" placeholder="Ask anything..."></textarea><div class="opts"><label><input id="web" type="checkbox" checked> Internet</label><label><input id="learn" type="checkbox" {% if auto_learn %}checked{% endif %}> Auto-learn verified web facts</label><button id="send">Send</button></div></div></section>
<aside><div class="panel"><h3>Teach memory</h3><textarea id="memory" placeholder="Add a fact, preference, process or project note..."></textarea><button onclick="addMemory()">Save memory</button></div><div class="panel"><h3>Upload knowledge</h3><input id="file" type="file" accept=".pdf,.docx,.xlsx,.txt,.md,.csv"><button onclick="uploadFile()">Learn file</button><small>PDF, DOCX, XLSX, TXT, MD, CSV</small></div><div class="panel"><h3>Continuous research</h3><input id="topic" placeholder="e.g. Qatar event technology suppliers"><button onclick="addTopic()">Add research topic</button><small>Scheduled worker can research active topics daily.</small></div></aside></main><script src="/static/app.js"></script></body></html>
